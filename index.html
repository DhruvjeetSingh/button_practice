<html lang="en">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Save Email</title>
  </head>
  <body style="font-weight: bold">
    <div class="looks">
      <p style="color: rgb(158, 2, 2);">Email & Submit</p>

        </div>
      </form>
    </div>
  </body>
</html>
